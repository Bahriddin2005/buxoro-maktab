{% comment %}
Matematik belgilar toolbar - kasrlar va darajalar.
Unicode belgilar - nusxalab web saytga tashlasa hech qanday o'zgarishsiz tushadi.
{% endcomment %}
<div class="math-toolbar btn-group btn-group-sm flex-wrap mb-1" role="group">
    <span class="text-white-50 small align-self-center me-2">Math:</span>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="½" title="1/2">½</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="¼" title="1/4">¼</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="¾" title="3/4">¾</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="¹⁄₂" title="1/2">¹⁄₂</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="²⁄₃" title="2/3">²⁄₃</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="³⁄₄" title="3/4">³⁄₄</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="¹⁄₄" title="1/4">¹⁄₄</button>
    <span class="mx-1 text-secondary">|</span>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="²" title="Daraja 2">x²</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="³" title="Daraja 3">x³</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="⁴" title="Daraja 4">x⁴</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="⁵" title="Daraja 5">x⁵</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="ⁿ" title="Daraja n">xⁿ</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="⁰" title="Daraja 0">⁰</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="¹" title="Daraja 1">¹</button>
    <span class="mx-1 text-secondary">|</span>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="₀" title="Indeks 0">₀</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="₁" title="Indeks 1">₁</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="₂" title="Indeks 2">₂</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="₃" title="Indeks 3">₃</button>
    <span class="mx-1 text-secondary">|</span>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="×" title="Ko'paytirish">×</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="÷" title="Bo'lish">÷</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="±" title="Plus-minus">±</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="√" title="Ildiz">√</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="π" title="Pi">π</button>
    <button type="button" class="btn btn-outline-light btn-sm math-insert" data-insert="∞" title="Cheksizlik">∞</button>
</div>
