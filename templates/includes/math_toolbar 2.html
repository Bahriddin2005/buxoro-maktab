{% comment %}
Matematik toolbar - kasrlar va darajalar uchun.
Unicode belgilar ishlatiladi - veb-saytga nusxalab qo'yilganda o'zgarishsiz saqlanadi.
{% endcomment %}
<div class="math-toolbar btn-group btn-group-sm flex-wrap mb-1" role="group">
    <span class="badge bg-secondary align-self-center me-1 px-2 py-1" style="font-size: 0.7rem;">Math:</span>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="½" title="1/2">½</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="¼" title="1/4">¼</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="¾" title="3/4">¾</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅓" title="1/3">⅓</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅔" title="2/3">⅔</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅕" title="1/5">⅕</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅗" title="3/5">⅗</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅙" title="1/6">⅙</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅛" title="1/8">⅛</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅜" title="3/8">⅜</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅝" title="5/8">⅝</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⅞" title="7/8">⅞</button>
    <span class="vr mx-1"></span>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⁰" title="daraja 0">⁰</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="¹" title="daraja 1">¹</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="²" title="daraja 2">²</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="³" title="daraja 3">³</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⁴" title="daraja 4">⁴</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⁵" title="daraja 5">⁵</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⁶" title="daraja 6">⁶</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⁷" title="daraja 7">⁷</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⁸" title="daraja 8">⁸</button>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="⁹" title="daraja 9">⁹</button>
    <span class="vr mx-1"></span>
    <button type="button" class="btn btn-outline-light math-insert-btn" data-insert="ⁿ⁄ₘ" title="Ixtiyoriy kasr (n/m)">ⁿ⁄ₘ</button>
</div>
