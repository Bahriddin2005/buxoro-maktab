<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
        .log { margin: 5px 0; }
        .error { color: #ff0000; }
        .success { color: #00ff00; }
        .info { color: #00ccff; }
        pre { background: #000; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔍 Test List API Debug</h1>
    <div id="logs"></div>
    
    <script>
        const logger = {
            log: (msg, data) => {
                const div = document.createElement('div');
                div.className = 'log info';
                div.textContent = msg;
                if (data) {
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(data, null, 2);
                    div.appendChild(pre);
                }
                document.getElementById('logs').appendChild(div);
            },
            error: (msg, data) => {
                const div = document.createElement('div');
                div.className = 'log error';
                div.textContent = '❌ ' + msg;
                if (data) {
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(data, null, 2);
                    div.appendChild(pre);
                }
                document.getElementById('logs').appendChild(div);
            },
            success: (msg, data) => {
                const div = document.createElement('div');
                div.className = 'log success';
                div.textContent = '✅ ' + msg;
                if (data) {
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(data, null, 2);
                    div.appendChild(pre);
                }
                document.getElementById('logs').appendChild(div);
            }
        };
        
        async function testAPI() {
            logger.log('🚀 Starting API test...');
            logger.log('📍 URL: /tests/');
            logger.log('📍 Headers: Accept: application/json');
            
            try {
                const response = await fetch('/tests/', {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                logger.success(`Response status: ${response.status}`);
                logger.log(`Response headers:`, Object.fromEntries(response.headers.entries()));
                
                const contentType = response.headers.get('content-type');
                logger.log(`Content-Type: ${contentType}`);
                
                if (!response.ok) {
                    const text = await response.text();
                    logger.error(`HTTP Error ${response.status}`, { body: text });
                    return;
                }
                
                const data = await response.json();
                logger.success('Data received successfully!');
                logger.log('Full response:', data);
                logger.log(`Tests count: ${data.tests?.length || 0}`);
                logger.log(`User role: ${data.user_role}`);
                
                if (data.tests && data.tests.length > 0) {
                    logger.success(`Found ${data.tests.length} tests!`);
                    logger.log('First test:', data.tests[0]);
                    logger.log('Last test:', data.tests[data.tests.length - 1]);
                } else {
                    logger.error('No tests found in response!');
                }
                
            } catch (error) {
                logger.error('Fetch failed:', { 
                    message: error.message,
                    stack: error.stack
                });
            }
        }
        
        testAPI();
    </script>
</body>
</html>
