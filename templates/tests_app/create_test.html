{% extends 'base.html' %}
{% load static %}

{% block title %}➕ Test Yaratish - Buxoro Bilimdonlar Maktabi{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        position: relative;
    }

    .main-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem;
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    .glass-card:hover {
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        transform: translateY(-2px);
    }

    .form-control, .form-select {
        background: rgba(255, 255, 255, 0.25) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        border-radius: 12px !important;
        color: #fff !important;
        padding: 12px 16px !important;
        transition: all 0.3s ease;
    }

    .form-control:focus, .form-select:focus {
        background: rgba(255, 255, 255, 0.35) !important;
        border-color: rgba(255, 255, 255, 0.5) !important;
        box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.25) !important;
        color: #fff !important;
    }

    .form-control::placeholder, .form-select::placeholder {
        color: rgba(255, 255, 255, 0.6) !important;
    }

    .form-label {
        color: #fff !important;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .question-item {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(15px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 24px !important;
        margin-bottom: 20px;
        transition: all 0.3s ease;
        position: relative;
    }

    .question-item::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px 0 0 16px;
    }

    .question-item:hover {
        transform: translateX(5px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .question-number-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        color: #fff;
        font-weight: bold;
        font-size: 14px;
        margin-right: 12px;
    }

    .question-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    .question-title {
        display: flex;
        align-items: center;
        color: #fff;
        font-weight: 600;
        font-size: 18px;
        margin: 0;
    }

    .btn-delete-question {
        background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        border: none;
        border-radius: 10px;
        color: #fff;
        padding: 8px 16px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(238, 90, 111, 0.3);
    }

    .btn-delete-question:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(238, 90, 111, 0.4);
        color: #fff;
    }

    .btn-add-question {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        border-radius: 12px;
        color: #fff;
        padding: 12px 24px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-add-question:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        color: #fff;
    }

    .btn-add-choice {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        border: none;
        border-radius: 10px;
        color: #fff;
        padding: 8px 16px;
        font-size: 13px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-add-choice:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        color: #fff;
    }

    .btn-remove-choice {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        border: none;
        border-radius: 8px;
        color: #fff;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .btn-remove-choice:hover {
        transform: scale(1.1);
        color: #fff;
    }

    .choice-item {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .choice-item:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateX(5px);
    }

    .choice-item input[type="text"] {
        background: transparent !important;
        border: none !important;
        color: #fff !important;
        flex: 1;
    }

    .choice-item input[type="text"]:focus {
        background: transparent !important;
        box-shadow: none !important;
    }

    .form-check-input {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        background-color: transparent;
        cursor: pointer;
    }

    .form-check-input:checked {
        background-color: #667eea;
        border-color: #667eea;
    }

    .form-check-label {
        color: #fff !important;
        cursor: pointer;
        font-size: 14px;
        margin-left: 8px;
    }

    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 12px;
        padding: 14px 32px;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        color: #fff;
    }

    .btn-secondary {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 14px 32px;
        font-weight: 600;
        color: #fff;
        transition: all 0.3s ease;
    }

    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.3);
        color: #fff;
        transform: translateY(-2px);
    }

    .section-divider {
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.3) 50%, transparent 100%);
        margin: 30px 0;
        border: none;
    }

    .page-header {
        text-align: center;
        margin-bottom: 40px;
        padding: 30px 0;
    }

    .page-header-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 36px;
        color: #fff;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    .questions-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .questions-section-title {
        color: #fff;
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .questions-section-title i {
        font-size: 28px;
        color: #10b981;
    }

    .checkbox-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .form-check {
        background: rgba(255, 255, 255, 0.1);
        padding: 12px 16px;
        border-radius: 10px;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .form-check:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateX(5px);
    }

    @media (max-width: 768px) {
        .main-container {
            padding: 1rem 0.5rem;
        }
        
        .question-item {
            padding: 16px !important;
        }
        
        .btn-primary, .btn-secondary {
            width: 100%;
            margin-bottom: 10px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="main-container">
    <div class="glass-card p-4 p-md-5" data-aos="fade-up">
        <!-- Page Header -->
        <div class="page-header">
            <div class="page-header-icon">
                <i class="fas fa-plus-circle"></i>
            </div>
            <h2 class="text-white mb-2" style="font-weight: 700; font-size: 32px;">Yangi Test Yaratish</h2>
            <p class="text-white-50" style="font-size: 16px;">O'quvchilar uchun test tuzish</p>
        </div>

        <form id="createTestForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Test asosiy ma'lumotlari -->
            <div class="glass-card p-4 mb-4" style="background: rgba(255, 255, 255, 0.1);">
                <h5 class="text-white mb-4" style="font-weight: 600;">
                    <i class="fas fa-info-circle me-2"></i>Test Asosiy Ma'lumotlari
                </h5>
                
                <div class="row g-3">
                    <div class="col-md-8">
                        <label for="testTitle" class="form-label">
                            <i class="fas fa-heading me-2"></i>Test nomi
                        </label>
                        <input type="text" class="form-control" id="testTitle" name="title" 
                               placeholder="Masalan: Matematika - Algebraik ifodalar" required>
                    </div>
                    <div class="col-md-4">
                        <label for="testGrade" class="form-label">
                            <i class="fas fa-layer-group me-2"></i>Sinf
                        </label>
                        <select class="form-select" id="testGrade" name="grade" required>
                            <option value="">Sinf tanlang</option>
                            {% for i in "123456789" %}
                            <option value="{{ i }}">{{ i }}-sinf</option>
                            {% endfor %}
                            <option value="10">10-sinf</option>
                            <option value="11">11-sinf</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="testSubject" class="form-label">
                            <i class="fas fa-book me-2"></i>Fan
                        </label>
                        <input type="text" class="form-control" id="testSubject" name="subject" 
                               placeholder="Masalan: Matematika" required>
                    </div>
                    <div class="col-md-3">
                        <label for="timeLimit" class="form-label">
                            <i class="fas fa-clock me-2"></i>Vaqt chegarasi (daqiqa)
                        </label>
                        <input type="number" class="form-control" id="timeLimit" name="time_limit" 
                               min="5" max="180" value="45" required>
                    </div>
                    <div class="col-md-3">
                        <label for="maxAttempts" class="form-label">
                            <i class="fas fa-redo me-2"></i>Maksimal urinishlar
                        </label>
                        <input type="number" class="form-control" id="maxAttempts" name="max_attempts" 
                               min="1" max="5" value="1" required>
                    </div>
                    <div class="col-12">
                        <label for="testDescription" class="form-label">
                            <i class="fas fa-align-left me-2"></i>Test haqida qisqacha ma'lumot
                        </label>
                        <textarea class="form-control" id="testDescription" name="description" 
                                  rows="3" placeholder="Test haqida qisqacha ma'lumot"></textarea>
                    </div>
                </div>
            </div>

            <!-- Checkboxlar -->
            <div class="checkbox-group mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="showResults" name="show_results" checked>
                    <label class="form-check-label" for="showResults">
                        <i class="fas fa-eye me-2"></i>O'quvchilarga natijalarni ko'rsatish
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="isActive" name="is_active" checked>
                    <label class="form-check-label" for="isActive">
                        <i class="fas fa-power-off me-2"></i>Testni faollashtirish
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="shuffleQuestions" name="shuffle_questions" checked>
                    <label class="form-check-label" for="shuffleQuestions">
                        <i class="fas fa-random me-2"></i>Savollarni random tartibda ko'rsatish
                    </label>
                </div>
            </div>

            <!-- Savollar qismi -->
            <div class="mb-5">
                <div class="questions-section-header">
                    <h4 class="questions-section-title">
                        <i class="fas fa-question-circle"></i>
                        <span>Savollar</span>
                    </h4>
                    <button type="button" class="btn btn-add-question" id="addQuestionBtn">
                        <i class="fas fa-plus me-2"></i>Savol qo'shish
                    </button>
                </div>
                
                <div id="questionsContainer">
                    <!-- Savollar bu yerda qo'shiladi -->
                </div>
                
                <!-- Pastdagi savol qo'shish tugmasi -->
                <div class="text-center mt-4">
                    <button type="button" class="btn btn-add-question" id="addQuestionBtnBottom">
                        <i class="fas fa-plus me-2"></i>Yana savol qo'shish
                    </button>
                </div>
            </div>

            <!-- Tugmalar -->
            <div class="text-center pt-4">
                <button type="button" class="btn btn-secondary btn-lg me-3" onclick="history.back()">
                    <i class="fas fa-arrow-left me-2"></i>Bekor qilish
                </button>
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-save me-2"></i>TESTNI SAQLASH
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Savol shablon (Ko'rinmas) -->
<template id="questionTemplate">
    <div class="question-item" data-aos="fade-up">
        <div class="question-header">
            <h5 class="question-title">
                <span class="question-number-badge question-number">1</span>
                <span>Savol</span>
            </h5>
            <button type="button" class="btn btn-delete-question remove-question">
                <i class="fas fa-trash me-1"></i>O'chirish
            </button>
        </div>
        
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label">Savol matni</label>
                <textarea class="form-control" name="question_text[]" rows="3" required></textarea>
            </div>
            <div class="col-md-2">
                <label class="form-label">Tur</label>
                <select class="form-select question-type" name="question_type[]" required>
                    <option value="single_choice">Bir javob</option>
                    <option value="multiple_choice">Ko'p javob</option>
                    <option value="text_answer">Matnli javob</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Ball</label>
                <input type="number" class="form-control" name="points[]" min="0.5" max="10" step="0.5" value="1" required>
            </div>
        </div>
        
        <div class="choices-container">
            <div class="mb-3">
                <label class="form-label mb-3">
                    <i class="fas fa-list-ul me-2"></i>Javob variantlari
                </label>
                <div class="choice-items">
                    <div class="choice-item d-flex align-items-center gap-2">
                        <input type="radio" class="form-check-input" name="correct_choice_1" value="0" style="width: 20px; height: 20px;">
                        <input type="text" class="form-control" name="choices_1[]" placeholder="Javob varianti 1" required>
                    </div>
                    <div class="choice-item d-flex align-items-center gap-2">
                        <input type="radio" class="form-check-input" name="correct_choice_1" value="1" style="width: 20px; height: 20px;">
                        <input type="text" class="form-control" name="choices_1[]" placeholder="Javob varianti 2" required>
                    </div>
                </div>
                <button type="button" class="btn btn-add-choice mt-3 add-choice">
                    <i class="fas fa-plus me-2"></i>Variant qo'shish
                </button>
            </div>
        </div>
        
        <div class="mt-3">
            <label class="form-label">
                <i class="fas fa-comment-dots me-2"></i>Tushuntirish (ixtiyoriy)
            </label>
            <textarea class="form-control" name="explanation[]" rows="2" placeholder="Javob uchun tushuntirish"></textarea>
        </div>
        
        <div class="mt-3">
            <label class="form-label">
                <i class="fas fa-image me-2"></i>Savol uchun rasm (ixtiyoriy)
            </label>
            <input type="file" class="form-control" name="question_image[]" accept="image/*">
            <div class="form-text text-muted mt-1" style="font-size: 0.85rem;">
                JPG, PNG, GIF formatlari qo'llab-quvvatlanadi. Maksimal hajm: 1GB
            </div>
            <div class="image-preview mt-2" style="display: none;">
                <img src="" alt="Preview" style="max-width: 200px; max-height: 200px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2);">
            </div>
        </div>
    </div>
</template>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let questionCount = 0;
    
    // Savol qo'shish tugmalari
    document.getElementById('addQuestionBtn').addEventListener('click', function() {
        addQuestion();
        scrollToBottom();
    });
    
    // Pastdagi savol qo'shish tugmasi
    document.getElementById('addQuestionBtnBottom').addEventListener('click', function() {
        addQuestion();
    });
    
    // Birinchi savolni qo'shish
    addQuestion();
    
    // Pastga scroll qilish funksiyasi
    function scrollToBottom() {
        setTimeout(() => {
            document.getElementById('addQuestionBtnBottom').scrollIntoView({ 
                behavior: 'smooth', 
                block: 'center' 
            });
        }, 300);
    }
    
    function addQuestion() {
        questionCount++;
        const template = document.getElementById('questionTemplate');
        const clone = template.content.cloneNode(true);
        
        // Savol raqamini yangilash
        clone.querySelector('.question-number').textContent = questionCount;
        
        // Name attributelarini yangilash
        const inputs = clone.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            if (input.name && input.name.includes('_1')) {
                input.name = input.name.replace('_1', '_' + questionCount);
            }
            if (input.name === 'correct_choice_1') {
                input.name = 'correct_choice_' + questionCount;
            }
        });
        
        // Image preview funksiyasi
        const imageInput = clone.querySelector('input[type="file"]');
        const imagePreview = clone.querySelector('.image-preview');
        const previewImg = clone.querySelector('.image-preview img');
        
        if (imageInput && imagePreview && previewImg) {
            imageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    // Fayl hajmini tekshirish (1GB)
                    const MAX_FILE_SIZE = 1024 * 1024 * 1024; // 1GB
                    if (file.size > MAX_FILE_SIZE) {
                        alert('⚠️ Rasm hajmi 1GB dan katta bo\'lishi mumkin emas!');
                        e.target.value = '';
                        return;
                    }
                    
                    // Formatni tekshirish
                    const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
                    if (!validTypes.includes(file.type)) {
                        alert('⚠️ Faqat JPG, PNG yoki GIF formatidagi rasmlar qo\'llab-quvvatlanadi!');
                        e.target.value = '';
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        previewImg.src = event.target.result;
                        imagePreview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    imagePreview.style.display = 'none';
                }
            });
        }
        
        // Radio button'lar uchun name yangilash
        const radios = clone.querySelectorAll('input[type="radio"]');
        radios.forEach(radio => {
            if (radio.name.includes('_1')) {
                radio.name = radio.name.replace('_1', '_' + questionCount);
            }
        });
        
        // O'chirish tugmasiga event listener
        clone.querySelector('.remove-question').addEventListener('click', function() {
            if (questionCount > 1) {
                this.closest('.question-item').style.transition = 'all 0.3s ease';
                this.closest('.question-item').style.transform = 'translateX(-100%)';
                this.closest('.question-item').style.opacity = '0';
                setTimeout(() => {
                    this.closest('.question-item').remove();
                    updateQuestionNumbers();
                }, 300);
            } else {
                alert('⚠️ Kamida bitta savol bo\'lishi kerak!');
            }
        });
        
        // Savol turini o'zgartirish
        const typeSelect = clone.querySelector('.question-type');
        typeSelect.addEventListener('change', function() {
            toggleChoicesContainer(this);
        });
        
        // Variant qo'shish tugmasi
        clone.querySelector('.add-choice').addEventListener('click', function() {
            addChoice(this, questionCount);
        });
        
        // Variant o'chirish tugmalari
        clone.querySelectorAll('.choice-item').forEach(item => {
            if (item.querySelector('.btn-remove-choice')) {
                item.querySelector('.btn-remove-choice').addEventListener('click', function() {
                    const choiceItems = this.closest('.choice-items');
                    if (choiceItems.children.length > 2) {
                        this.closest('.choice-item').remove();
                    } else {
                        alert('⚠️ Kamida ikkita variant bo\'lishi kerak!');
                    }
                });
            }
        });
        
        document.getElementById('questionsContainer').appendChild(clone);
        
        // Animation
        const newQuestion = document.getElementById('questionsContainer').lastElementChild;
        newQuestion.style.opacity = '0';
        newQuestion.style.transform = 'translateY(20px)';
        setTimeout(() => {
            newQuestion.style.transition = 'all 0.3s ease';
            newQuestion.style.opacity = '1';
            newQuestion.style.transform = 'translateY(0)';
        }, 10);
    }
    
    function updateQuestionNumbers() {
        const questions = document.querySelectorAll('.question-item');
        questions.forEach((question, index) => {
            question.querySelector('.question-number').textContent = index + 1;
        });
        questionCount = questions.length;
    }
    
    function toggleChoicesContainer(select) {
        const container = select.closest('.question-item').querySelector('.choices-container');
        const questionType = select.value;
        
        if (questionType === 'text_answer') {
            container.style.opacity = '0';
            container.style.height = container.offsetHeight + 'px';
            setTimeout(() => {
                container.style.display = 'none';
            }, 300);
        } else {
            container.style.display = 'block';
            setTimeout(() => {
                container.style.opacity = '1';
            }, 10);
            
            // Radio yoki checkbox o'zgartirish
            const choiceItems = container.querySelectorAll('.choice-item');
            choiceItems.forEach(item => {
                const radio = item.querySelector('input[type="radio"]');
                const checkbox = item.querySelector('input[type="checkbox"]');
                
                if (questionType === 'single_choice') {
                    if (checkbox) {
                        const newRadio = document.createElement('input');
                        newRadio.type = 'radio';
                        newRadio.className = 'form-check-input';
                        newRadio.name = checkbox.name;
                        newRadio.value = checkbox.value;
                        newRadio.style.width = '20px';
                        newRadio.style.height = '20px';
                        checkbox.replaceWith(newRadio);
                    }
                } else if (questionType === 'multiple_choice') {
                    if (radio) {
                        const newCheckbox = document.createElement('input');
                        newCheckbox.type = 'checkbox';
                        newCheckbox.className = 'form-check-input';
                        newCheckbox.name = radio.name.replace('correct_choice', 'correct_choices');
                        newCheckbox.value = radio.value;
                        newCheckbox.style.width = '20px';
                        newCheckbox.style.height = '20px';
                        radio.replaceWith(newCheckbox);
                    }
                }
            });
        }
    }
    
    function addChoice(button, questionNum) {
        const choiceItems = button.parentElement.querySelector('.choice-items');
        const choiceCount = choiceItems.children.length;
        const questionItem = button.closest('.question-item');
        const questionType = questionItem.querySelector('.question-type').value;
        
        const inputType = questionType === 'single_choice' ? 'radio' : 'checkbox';
        const inputName = questionType === 'single_choice' ? `correct_choice_${questionNum}` : `correct_choices_${questionNum}[]`;
        
        const choiceHtml = `
            <div class="choice-item d-flex align-items-center gap-2" style="animation: slideIn 0.3s ease;">
                <input type="${inputType}" class="form-check-input" name="${inputName}" value="${choiceCount}" style="width: 20px; height: 20px;">
                <input type="text" class="form-control" name="choices_${questionNum}[]" placeholder="Javob varianti ${choiceCount + 1}" required>
                <button type="button" class="btn btn-remove-choice remove-choice">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `;
        
        choiceItems.insertAdjacentHTML('beforeend', choiceHtml);
        
        // O'chirish tugmasiga event
        const newChoiceItem = choiceItems.lastElementChild;
        newChoiceItem.querySelector('.remove-choice').addEventListener('click', function() {
            if (choiceItems.children.length > 2) {
                this.closest('.choice-item').style.transform = 'translateX(-100%)';
                this.closest('.choice-item').style.opacity = '0';
                setTimeout(() => {
                    this.closest('.choice-item').remove();
                }, 300);
            } else {
                alert('⚠️ Kamida ikkita variant bo\'lishi kerak!');
            }
        });
    }
    
    // Form yuborish
    document.getElementById('createTestForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saqlanmoqda...';
        submitBtn.disabled = true;
        
        const formData = new FormData(this);
        
        fetch('/tests/create/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('✅ Test muvaffaqiyatli yaratildi!');
                window.location.href = '/accounts/dashboard/';
            } else {
                alert('❌ Xatolik: ' + (data.error || 'Noma\'lum xatolik'));
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('❌ Server bilan bog\'lanishda xatolik!');
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        });
    });
    
    // Add animation keyframes
    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    `;
    document.head.appendChild(style);
});
</script>
{% endblock %}
